[browser]
gatherUsageStats = false

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 50

[theme]
primaryColor = "#2E6B4F"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
font = "sans serif"
# Section headings (st.subheader) were 28px and louder than the app title.
headingFontSizes = ["2rem", "1.625rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
